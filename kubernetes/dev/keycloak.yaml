apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: dev
  labels:
    app: keycloak
spec:
  instances: 1
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealm
metadata:
  name: codex
  namespace: dev
  labels:
    app: codex
spec:
  instanceSelector:
    matchLabels:
      app: keycloak
  realm:
    realm: codex
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakClient
metadata:
  name: codex-frontend
  namespace: dev
spec:
  realmSelector:
    matchLabels:
      app: codex
  client:
    clientId: codex-frontend
    publicClient: true
    redirectUris:
      - http://localhost:30080/*
