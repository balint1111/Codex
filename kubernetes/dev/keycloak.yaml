---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: dev
  labels:
    app: keycloak
spec:
  instances: 1
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealm
metadata:
  name: codex
  namespace: dev
  labels:
    app: codex
spec:
  instanceSelector:
    matchLabels:
      app: keycloak
  realm:
    id: codex
    realm: codex
    displayName: codex
    enabled: true
    # embed clients here
    clients:
      - clientId: codex-frontend
        publicClient: true
        redirectUris:
          - "http://localhost:30080/*"
