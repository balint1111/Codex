apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: dev
  labels:
    app: keycloak
spec:
  instances: 1
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: codex
  namespace: dev
  labels:
    app: codex
spec:
  keycloakCRName: keycloak            # points to the Keycloak CR above
  realm:
    id: codex
    realm: codex
    displayName: codex
    enabled: true
    # embed clients here
    clients:
      - clientId: codex-frontend
        publicClient: true
        redirectUris:
          - "http://localhost:30080/*"
        # optional: other client config fields, e.g. protocol, directAccessGrantsEnabled, etc.
