{{- $values := .Values.frontend | default .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-frontend
  labels:
    app: codex-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-frontend
  template:
    metadata:
      labels:
        app: codex-frontend
    spec:
      containers:
        - name: frontend
          image: {{ $values.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            {{- range $name, $value := $values.env }}
            - name: {{ $name }}
              value: "{{ $value }}"
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-frontend
  labels:
    app: codex-frontend
spec:
  type: {{ $values.service.type }}
  selector:
    app: codex-frontend
  ports:
    - port: 80
      targetPort: 80
      {{- if $values.service.nodePort }}
      nodePort: {{ $values.service.nodePort }}
      {{- end }}
