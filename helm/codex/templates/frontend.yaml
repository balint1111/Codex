apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-frontend
  labels:
    app: codex-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-frontend
  template:
    metadata:
      labels:
        app: codex-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
{{- range $name, $value := .Values.frontend.env }}
            - name: {{ $name }}
              value: "{{ $value }}"
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-frontend
  labels:
    app: codex-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: codex-frontend
  ports:
    - port: 80
      targetPort: 80
{{- if .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
{{- end }}
