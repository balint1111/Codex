databaseChangeLog:
  - changeSet:
      id: "1"
      author: codex
      changes:
        - createTable:
            tableName: privilege
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: "2"
      author: codex
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(100)
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValue: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: "3"
      author: codex
      changes:
        - createTable:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_user_privilege_user
                    references: users(id)
              - column:
                  name: privilege_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_user_privilege_privilege
                    references: privilege(id)

  - changeSet:
      id: "4"
      author: codex
      changes:
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: name
                  value: dashboard
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: name
                  value: users

  - changeSet:
      id: "6"
      author: codex
      changes:
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 1
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 2

  - changeSet:
      id: "7"
      author: codex
      changes:
        - createIndex:
            indexName: idx_users_username
            tableName: users
            columns:
              - column:
                  name: username
        - createIndex:
            indexName: idx_users_deleted
            tableName: users
            columns:
              - column:
                  name: deleted
        - createIndex:
            indexName: idx_user_privilege_user_id
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_user_privilege_privilege_id
            tableName: user_privilege
            columns:
              - column:
                  name: privilege_id
