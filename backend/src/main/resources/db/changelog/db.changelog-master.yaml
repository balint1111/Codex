databaseChangeLog:
  - changeSet:
      id: "1"
      author: codex
      changes:
        - createTable:
            tableName: privilege
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: "2"
      author: codex
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(100)
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValue: false

  - changeSet:
      id: "3"
      author: codex
      changes:
        - createTable:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: privilege_id
                  type: BIGINT

  - changeSet:
      id: "4"
      author: codex
      changes:
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: name
                  value: dashboard
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: name
                  value: users

  - changeSet:
      id: "6"
      author: codex
      changes:
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 1
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 2

  - changeSet:
      id: "7"
      author: codex
      changes:
        - addForeignKeyConstraint:
            baseTableName: user_privilege
            baseColumnNames: user_id
            constraintName: fk_user_privilege_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_privilege
            baseColumnNames: privilege_id
            constraintName: fk_user_privilege_privilege_id
            referencedTableName: privilege
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: "8"
      author: codex
      changes:
        - createIndex:
            tableName: users
            indexName: idx_users_username
            columns:
              - column:
                  name: username
        - createIndex:
            tableName: users
            indexName: idx_users_deleted
            columns:
              - column:
                  name: deleted
        - createIndex:
            tableName: user_privilege
            indexName: idx_user_privilege_user_id
            columns:
              - column:
                  name: user_id
