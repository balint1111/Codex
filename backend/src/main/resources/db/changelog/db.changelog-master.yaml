databaseChangeLog:
  - changeSet:
      id: "1"
      author: codex
      changes:
        - createTable:
            tableName: privilege
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: "2"
      author: codex
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(100)
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValue: false

  - changeSet:
      id: "3"
      author: codex
      changes:
        - createTable:
            tableName: user_privilege
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_privilege_user
                    references: users(id)
              - column:
                  name: privilege_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_privilege_privilege
                    references: privilege(id)
        - addUniqueConstraint:
            tableName: user_privilege
            columnNames: user_id, privilege_id
            constraintName: uq_user_privilege_user_id_privilege_id

  - changeSet:
      id: "4"
      author: codex
      context: seed
      changes:
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: name
                  value: dashboard
        - insert:
            tableName: privilege
            columns:
              - column:
                  name: id
                  valueNumeric: 2
              - column:
                  name: name
                  value: users

  - changeSet:
      id: "5"
      author: codex
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: external_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
                    unique: true

  - changeSet:
      id: "6"
      author: codex
      context: seed
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: external_id
                  value: ext-admin
              - column:
                  name: username
                  value: admin
              - column:
                  name: password
                  value: '$2a$10$WoXrXURx4zRIp7Sct7Sd3e31kc5zD7Ng.awIPpK/9PNKHazR3.JRK'
              - column:
                  name: deleted
                  valueBoolean: false
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 1
        - insert:
            tableName: user_privilege
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: privilege_id
                  valueNumeric: 2
