apiVersion: skaffold/v2beta9
kind: Config
metadata:
  name: codex-backend
build:
  artifacts:
    - image: localhost:5000/codex-backend
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    push: true
deploy:
  helm:
    releases:
      - name: codex-backend
        chartPath: ../helm/backend
        namespace: dev
        createNamespace: true
        valuesFiles:
          - ../helm/backend/values.yaml
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED}}"
